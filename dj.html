<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Monitor v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}
body{background:#0a0e14;color:#fff;height:100vh;display:flex;flex-direction:column;}
.top{background:#121820;border-bottom:2px solid #00ffcc;padding:8px;}
.row{display:flex;align-items:center;gap:10px;}
.box{background:#0d1117;border:1px solid #00ffcc;border-radius:8px;padding:6px 10px;flex:1;}
.fname{font-size:1.4rem;font-weight:900;color:#ffd700;}
.gname{font-size:.9rem;}
button{padding:6px 10px;border:none;border-radius:5px;cursor:pointer;background:#252a35;color:#fff;font-weight:700;}
.play{background:#2ecc71;color:#000;}
.stop{background:#e74c3c;}
.main{flex:1;display:flex;min-height:0;}
.left{width:160px;background:#121820;border-right:1px solid #333;overflow-y:auto;}
.center{flex:1;display:flex;flex-direction:column;}
.tracks{flex:1;overflow-y:auto;background:#0d1117;}
.track{padding:5px 8px;border-bottom:1px solid #222;cursor:pointer;display:flex;font-size:.8rem;}
.track:hover{background:#1a2230;}
.track.on{background:#1a3a1a;color:#2ecc71;}
.bot{background:#121820;padding:6px;border-top:1px solid #333;}
input[type=range]{accent-color:#ffd700;}
#status{font-size:.75rem;color:#aaa;}
</style>
</head>
<body>
<div class="top">
  <div style="font-size:.6rem;color:#666;">DJ Monitor v5</div>
  <div class="row">
    <div class="box">
      <div style="font-size:.6rem;color:#aaa;">ULTIMUL SOSIT</div>
      <div class="fname" id="family">—</div>
      <div class="gname" id="guest"></div>
    </div>
    <div style="text-align:right;font-size:.75rem;">
      <div id="sA" style="color:#2ecc71;">SOSIȚI: 0</div>
      <div id="sR" style="color:#e74c3c;">RĂMAȘI: 0</div>
      <div id="sT" style="color:#aaa;">TOTAL: 0</div>
    </div>
    <div>
      <button onclick="document.getElementById('marsIn').click()">+ Marș</button>
      <span id="marsName" style="font-size:.75rem;margin:0 6px;">—</span>
      <button class="play" onclick="playMars(true)">▶</button>
      <button class="stop" onclick="stopMars()">■</button>
      <label style="font-size:.7rem;"><input type="checkbox" id="auto" checked> Auto</label>
      <label style="font-size:.7rem;"><input type="checkbox" id="norep" checked> Nu repeta</label>
    </div>
  </div>
  <div style="margin-top:4px;display:flex;align-items:center;gap:6px;font-size:.7rem;">
    <span id="mCur">0:00</span>
    <input type="range" id="mSeek" style="flex:1;" min="0" max="100" value="0">
    <span id="mTot">0:00</span>
  </div>
</div>

<div style="padding:4px 8px;background:#0d1117;display:flex;gap:6px;align-items:center;">
  <input id="djName" placeholder="DJ" style="padding:4px;background:#161a22;border:1px solid #333;color:#fff;width:100px;" onchange="localStorage.setItem('djName',this.value)">
  <button onclick="document.getElementById('fileIn').click()">+ File</button>
  <button onclick="document.getElementById('folderIn').click()">+ Folder</button>
  <button onclick="savePL()">Salvează</button>
  <span id="status" style="margin-left:auto;">Gata</span>
</div>

<div class="main">
  <div class="left" id="pls"></div>
  <div class="center">
    <div style="padding:4px;background:#121820;display:flex;gap:4px;">
      <button class="play" onclick="toggle()">▶</button>
      <button class="stop" onclick="stopPL()">■</button>
      <button onclick="next()">⏭</button>
    </div>
    <div class="tracks" id="tracks"></div>
  </div>
</div>

<div class="bot">
  <div style="display:flex;align-items:center;gap:6px;font-size:.7rem;">
    <span id="pCur">0:00</span>
    <input type="range" id="pSeek" style="flex:1;" min="0" max="100" value="0">
    <span id="pTot">0:00</span>
  </div>
  <div style="display:flex;gap:10px;margin-top:4px;font-size:.7rem;">
    <label>Vol PL <input type="range" id="vPL" min="0" max="100" value="80" style="width:80px;"></label>
    <label>Vol Marș <input type="range" id="vM" min="0" max="100" value="90" style="width:80px;"></label>
  </div>
</div>

<input type="file" id="marsIn" accept="audio/*" style="display:none">
<input type="file" id="fileIn" multiple accept="audio/*" style="display:none">
<input type="file" id="folderIn" webkitdirectory multiple style="display:none">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDZEEPkP_r0bOLQ8_A3nv5G-3qIVDZVhlo",authDomain:"eventkiosk-98d9d.firebaseapp.com",projectId:"eventkiosk-98d9d",storageBucket:"eventkiosk-98d9d.firebasestorage.app",messagingSenderId:"502704432025",appId:"1:502704432025:web:1ca8358fad1678419c2908"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let PLS=JSON.parse(localStorage.getItem("djPL")||'[{"n":"Main","t":[]}]');
let curPL=0, curT=-1, audio=null, marsA=null, playing=false, wasPlaying=false, lastFam="", marsUrl=null;
const status=document.getElementById("status");

function savePL(){ localStorage.setItem("djPL",JSON.stringify(PLS)); status.textContent="Salvat"; }
function renderPL(){
  const el=document.getElementById("pls"); el.innerHTML="";
  PLS.forEach((p,i)=>{
    const d=document.createElement("div");
    d.style.cssText="padding:6px;cursor:pointer;"+(i===curPL?"background:#1a2230;":"");
    d.textContent=p.n;
    d.onclick=()=>{curPL=i;renderPL();renderT();};
    el.appendChild(d);
  });
}
function renderT(){
  const el=document.getElementById("tracks"); el.innerHTML="";
  (PLS[curPL].t||[]).forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="track"+(i===curT?" on":"");
    d.innerHTML=`<span style="flex:1">${t.n}</span><span style="color:#888">${t.d||""}</span>`;
    d.ondblclick=()=>playT(i);
    el.appendChild(d);
  });
}
function addT(f){
  if(!f) return;
  const url=URL.createObjectURL(f);
  const a=new Audio(url);
  a.onloadedmetadata=()=>{
    if(!PLS[curPL].t) PLS[curPL].t=[];
    PLS[curPL].t.push({n:f.name,u:url,d:fmt(a.duration)});
    renderT(); savePL();
    status.textContent="OK "+f.name;
  };
}
function playT(i){
  curT=i; const t=PLS[curPL].t[i]; if(!t) return;
  if(marsA){marsA.pause();marsA=null;}
  if(audio) audio.pause();
  audio=new Audio(t.u);
  audio.volume=document.getElementById("vPL").value/100;
  audio.onended=()=>{ if(curT<PLS[curPL].t.length-1) playT(curT+1); };
  audio.play().catch(()=>{});
  playing=true; status.textContent="▶ "+t.n; renderT();
}
function toggle(){ if(!audio){ if(PLS[curPL].t.length) playT(0); return; } if(playing){audio.pause();playing=false;}else{audio.play();playing=true;} }
function stopPL(){ if(audio){audio.pause();audio.currentTime=0;} playing=false; status.textContent="Stop"; }
function next(){ if(curT<PLS[curPL].t.length-1) playT(curT+1); }
function fmt(s){ if(!s) return "0:00"; const m=Math.floor(s/60),sec=Math.floor(s%60); return m+":"+(sec<10?"0":"")+sec; }

function saveMars(f){
  marsUrl=URL.createObjectURL(f);
  document.getElementById("marsName").textContent=f.name;
  status.textContent="Marș OK";
}
function playMars(manual){
  if(!manual && !document.getElementById("auto").checked) return;
  const fam=document.getElementById("family").textContent;
  if(!manual && document.getElementById("norep").checked && fam===lastFam && fam!=="—"){ status.textContent="Repetat"; return; }
  if(fam!=="—") lastFam=fam;
  wasPlaying=playing;
  if(audio && playing){ audio.pause(); playing=false; }
  if(!marsUrl){ status.textContent="Fără marș"; return; }
  if(marsA) marsA.pause();
  marsA=new Audio(marsUrl);
  marsA.volume=document.getElementById("vM").value/100;
  marsA.onended=()=>{ marsA=null; if(wasPlaying && audio){ audio.play(); playing=true; } };
  marsA.play().catch(()=>{});
  status.textContent="Marș...";
}
function stopMars(){ if(marsA){marsA.pause();marsA=null;} if(wasPlaying && audio){audio.play();playing=true;} status.textContent="Marș stop"; }

document.getElementById("marsIn").onchange=e=>{ const f=e.target.files[0]; if(f) saveMars(f); e.target.value=""; };
document.getElementById("fileIn").onchange=e=>{ [...e.target.files].forEach(addT); e.target.value=""; };
document.getElementById("folderIn").onchange=e=>{ [...e.target.files].forEach(addT); e.target.value=""; };

setInterval(()=>{
  if(marsA && !marsA.paused){
    document.getElementById("mCur").textContent=fmt(marsA.currentTime);
    document.getElementById("mTot").textContent=fmt(marsA.duration);
    if(marsA.duration) document.getElementById("mSeek").value=(marsA.currentTime/marsA.duration)*100;
  }
  if(audio && !audio.paused){
    document.getElementById("pCur").textContent=fmt(audio.currentTime);
    document.getElementById("pTot").textContent=fmt(audio.duration);
    if(audio.duration) document.getElementById("pSeek").value=(audio.currentTime/audio.duration)*100;
  }
},200);
document.getElementById("mSeek").oninput=e=>{ if(marsA && marsA.duration) marsA.currentTime=(e.target.value/100)*marsA.duration; };
document.getElementById("pSeek").oninput=e=>{ if(audio && audio.duration) audio.currentTime=(e.target.value/100)*audio.duration; };
document.getElementById("vPL").oninput=e=>{ if(audio) audio.volume=e.target.value/100; };
document.getElementById("vM").oninput=e=>{ if(marsA) marsA.volume=e.target.value/100; };

db.ref("lastArrival").on("value",s=>{
  const d=s.val(); if(!d) return;
  document.getElementById("family").textContent=d.family?d.family.toUpperCase():"—";
  document.getElementById("guest").innerHTML=`<span style="color:#ffd700">${d.name||""}</span> <span style="color:#e74c3c">${d.table||""}</span>`;
  playMars(false);
});
db.ref("stats").on("value",s=>{
  const x=s.val()||{};
  document.getElementById("sA").textContent="SOSIȚI: "+(x.arrived||0);
  document.getElementById("sR").textContent="RĂMAȘI: "+(x.remaining||0);
  document.getElementById("sT").textContent="TOTAL: "+(x.total||0);
});

document.getElementById("djName").value=localStorage.getItem("djName")||"";
renderPL(); renderT();
document.addEventListener("keydown",e=>{ if(e.code==="Space"){e.preventDefault(); if(marsA&&!marsA.paused) stopMars(); else toggle();} });
</script>
</body>
</html>
