<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botez Morgan - Guestbook & Seat Finder</title>
  <style>
    :root {
      --bg-dark: #12141a;
      --card-bg: #1c202a;
      --accent: #e5a93c;
      --accent-hover: #f5bc54;
      --text: #f0f2f5;
      --text-muted: #9aa1b1;
      --border: #2c3242;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      max-height: 100vh;
      overflow: hidden; /* Nu permite scroll-ul ecranului principal */
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      height: 65px;
      padding: 0 24px;
      background: #181b24;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .event-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .counters {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .badge span {
      color: var(--accent);
      font-weight: 700;
    }

    .btn-settings {
      background: #252b3b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-settings:hover {
      background: var(--accent);
      color: #000;
    }

    /* MAIN CONTAINER CU COLOANE FIXE */
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 480px; /* Coloană stânga flexibilă, dreapta fixă */
      gap: 18px;
      padding: 18px;
      height: calc(100vh - 65px);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* COLOANA STÂNGA: CĂUTARE & REZULTAT & TASTATURĂ */
    .left-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      min-width: 0;
    }

    .search-result-box {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .search-input-display {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      min-height: 48px;
      display: flex;
      align-items: center;
      border-bottom: 2px dashed var(--border);
      width: 100%;
      justify-content: center;
      margin-bottom: 12px;
    }

    .placeholder-text {
      color: var(--text-muted);
      font-size: 1.2rem;
      font-weight: 400;
    }

    .seat-info {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
    }

    .guest-matched-name {
      font-size: 1.1rem;
      color: #79d799;
      margin-top: 4px;
      font-weight: 600;
    }

    /* LISTA SUGESTII INSTANTANEE */
    .suggestions {
      height: 80px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
      padding: 8px 0;
    }

    .sug-pill {
      background: #252b3b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .sug-pill:hover {
      background: var(--accent);
      color: #000;
    }

    /* TASTATURĂ VIRTUALĂ - MĂRIME STABILĂ */
    .keyboard {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .key {
      flex: 1;
      height: 52px;
      max-width: 65px;
      background: #252b3b;
      border: 1px solid #363e52;
      border-radius: 8px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #131722;
      transition: all 0.1s ease;
    }

    .key:active {
      transform: translateY(3px);
      box-shadow: none;
      background: var(--accent);
      color: #000;
    }

    .key.wide {
      max-width: 110px;
      background: #323b50;
      font-size: 1rem;
    }

    .key.space {
      max-width: 280px;
    }

    /* COLOANA DREAPTĂ: MEDIA (VIDEO & SCHIȚĂ FIXE) */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
      overflow: hidden; /* Oprește orice deplasare în afară */
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1; /* Împart în mod egal înălțimea */
      min-height: 0; /* Previne ruperea grid-ului */
    }

    .media-card-title {
      padding: 8px 12px;
      background: #171b24;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
    }

    .media-card-content {
      flex: 1;
      position: relative;
      background: #0d0f14;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* BLOCAREA CADRELOR LA DIMENSIUNI FIXE */
    .media-card-content video,
    .media-card-content img {
      width: 100%;
      height: 100%;
      object-fit: contain !important; /* Păstrează proporțiile fără a mări cutia */
      display: block;
    }

    .placeholder-media {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 15px;
    }

    /* MODAL PANOU CONTROL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal {
      background: #181b24;
      border: 2px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }

    .form-group input, 
    .form-group textarea {
      background: #252b3b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 160px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-save {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-cancel {
      background: transparent;
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER CU TITLU & STATISTICI -->
  <header>
    <div class="event-title" id="eventTitleDisplay">BOTEZ MORGAN - GEORGE GASTRO PUB</div>
    <div class="counters">
      <div class="badge">SOSIȚI: <span id="countArrived">0</span></div>
      <div class="badge">TOTAL: <span id="countTotal">46</span></div>
      <button class="btn-settings" onclick="openSettings()">⚙ Panou Control</button>
    </div>
  </header>

  <!-- CORPUL PRINCIPAL -->
  <div class="main-container">
    
    <!-- PARTEA STÂNGĂ: TASTATURĂ ȘI CĂUTARE -->
    <div class="left-column">
      <div class="search-result-box">
        <div class="search-input-display" id="searchDisplay">
          <span class="placeholder-text">Tastați numele dvs. pe ecran</span>
        </div>
        <div class="seat-info" id="seatDisplay">MASA: ---</div>
        <div class="guest-matched-name" id="matchedName"></div>
      </div>

      <!-- Sugestii rapide pe măsură ce tastezi -->
      <div class="suggestions" id="suggestionsBox"></div>

      <!-- TASTATURĂ VIRTUALĂ PE ECRAN -->
      <div class="keyboard">
        <div class="kb-row">
          <button class="key" onclick="pressKey('Q')">Q</button>
          <button class="key" onclick="pressKey('W')">W</button>
          <button class="key" onclick="pressKey('E')">E</button>
          <button class="key" onclick="pressKey('R')">R</button>
          <button class="key" onclick="pressKey('T')">T</button>
          <button class="key" onclick="pressKey('Y')">Y</button>
          <button class="key" onclick="pressKey('U')">U</button>
          <button class="key" onclick="pressKey('I')">I</button>
          <button class="key" onclick="pressKey('O')">O</button>
          <button class="key" onclick="pressKey('P')">P</button>
          <button class="key" onclick="pressKey('Ă')">Ă</button>
          <button class="key" onclick="pressKey('Î')">Î</button>
        </div>
        <div class="kb-row">
          <button class="key" onclick="pressKey('A')">A</button>
          <button class="key" onclick="pressKey('S')">S</button>
          <button class="key" onclick="pressKey('D')">D</button>
          <button class="key" onclick="pressKey('F')">F</button>
          <button class="key" onclick="pressKey('G')">G</button>
          <button class="key" onclick="pressKey('H')">H</button>
          <button class="key" onclick="pressKey('J')">J</button>
          <button class="key" onclick="pressKey('K')">K</button>
          <button class="key" onclick="pressKey('L')">L</button>
          <button class="key" onclick="pressKey('Ș')">Ș</button>
          <button class="key" onclick="pressKey('Ț')">Ț</button>
          <button class="key" onclick="pressKey('Â')">Â</button>
        </div>
        <div class="kb-row">
          <button class="key wide" onclick="clearSearch()">Golește</button>
          <button class="key" onclick="pressKey('Z')">Z</button>
          <button class="key" onclick="pressKey('X')">X</button>
          <button class="key" onclick="pressKey('C')">C</button>
          <button class="key" onclick="pressKey('V')">V</button>
          <button class="key" onclick="pressKey('B')">B</button>
          <button class="key" onclick="pressKey('N')">N</button>
          <button class="key" onclick="pressKey('M')">M</button>
          <button class="key wide" onclick="backspaceKey()">⌫ Șterge</button>
        </div>
        <div class="kb-row">
          <button class="key space" onclick="pressKey(' ')">SPAȚIU</button>
          <button class="key wide" style="background: #2e7d32;" onclick="confirmArrival()">Sosit ✓</button>
        </div>
      </div>
    </div>

    <!-- PARTEA DREAPTĂ: CADRE FIXE (VIDEO + SCHIȚĂ) -->
    <div class="right-column">
      
      <!-- CADRU 1: MOMENTE SPECIALE / VIDEO -->
      <div class="media-card">
        <div class="media-card-title">🎬 MOMENTE SPECIALE</div>
        <div class="media-card-content" id="videoBox">
          <video id="eventVideo" autoplay loop muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4"></video>
        </div>
      </div>

      <!-- CADRU 2: SCHIȚĂ SALĂ -->
      <div class="media-card">
        <div class="media-card-title">🗺️ SCHIȚĂ SALĂ RESTAURANT</div>
        <div class="media-card-content" id="mapBox">
          <img id="mapImage" src="" alt="Schiță Sală Restaurant" style="display: none;">
          <div id="mapPlaceholder" class="placeholder-media">
            Schița sălii se încarcă din Panoul de Control.<br>Imaginea va rămâne fixată fără să micșoreze tastatura.
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- PANOU CONTROL MODAL -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚙️ Panou Control Eveniment</h3>
        <button onclick="closeSettings()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>

      <div class="form-group">
        <label>Titlu Eveniment:</label>
        <input type="text" id="titleInput" value="BOTEZ MORGAN - GEORGE GASTRO PUB">
      </div>

      <div class="form-group">
        <label>Video Prezentare (Link extern sau fișier):</label>
        <input type="text" id="videoUrlInput" placeholder="Ex: link .mp4">
        <input type="file" id="videoFileInput" accept="video/*" onchange="loadLocalVideo(event)">
      </div>

      <div class="form-group">
        <label>Poză Schiță Sală (Imagine):</label>
        <input type="file" id="mapFileInput" accept="image/*" onchange="loadLocalMap(event)">
      </div>

      <div class="form-group">
        <label>Listă Invitați (Format: Nume Prenume, Masa X):</label>
        <textarea id="guestsInput"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeSettings()">Închide</button>
        <button class="btn-save" onclick="saveSettings()">Salvează Setările</button>
      </div>
    </div>
  </div>

  <script>
    // LISTA IMPLICITĂ BOTEZ MORGAN
    const defaultGuests = `Galatanu Marcel, Masa 1
Galatanu Marinela, Masa 1
Sârbu Alex, Masa 1
Galatanu Roxana, Masa 1
Sârbu Aaron, Masa 1
Sârbu Iris, Masa 1
Vârlan Cristi, Masa 1
Vârlan Nicoleta, Masa 1
Vârlan Andrei, Masa 1
Vârlan Stefano, Masa 1
Bitculescu Toma, Masa 1
Bitculescu Lenuța, Masa 1
Jipianu Petrică, Masa 1
Jipianu Cameluța, Masa 1
Anca Andruț, Masa 1
Anca Steluța, Masa 1
Barone Pietro, Masa 2
Rogoz Diana, Masa 2
Turcu Cristian, Masa 2
Oprea Mihai, Masa 2
Oprea Andreea, Masa 2
Postelnicu Angelo, Masa 2
Dragoș, Masa 2
Andreea (Dragoș), Masa 2
Marioara Marian, Masa 3
Marioara Florina, Masa 3
Mucă Daniel, Masa 3
Botorogeanu Marian, Masa 3
Botorogeanu Doinița, Masa 3
Botorogeanu Ionuț, Masa 3
Botorogeanu Mirela, Masa 3
Copil Botorogeanu, Masa 3
Marioara Niculina, Masa 4
Marioara Nicolae, Masa 4
Familia Bonteanu 1, Masa 4
Familia Bonteanu 2, Masa 4
Familia Bonteanu 3, Masa 4
Familia Bonteanu 4, Masa 4
Sârbu Florina, Masa 4
Sârbu Jan, Masa 4
Morgan (Sărbătoritul), Masa 5
Părinți, Masa 5
Nași, Masa 5
Invitat Special, Masa 5`;

    let currentQuery = "";
    let guestsList = [];
    let arrivedGuests = new Set();
    let currentMatchedGuest = null;

    // INIȚIALIZARE
    window.onload = function() {
      const savedTitle = localStorage.getItem('bm_title') || "BOTEZ MORGAN - 18 OCTOMBRIE";
      const savedGuests = localStorage.getItem('bm_guests') || defaultGuests;
      const savedMap = localStorage.getItem('bm_map');
      const savedVideo = localStorage.getItem('bm_video');

      document.getElementById('eventTitleDisplay').innerText = savedTitle;
      document.getElementById('titleInput').value = savedTitle;
      document.getElementById('guestsInput').value = savedGuests;

      if(savedMap) {
        setMapImage(savedMap);
      }
      if(savedVideo) {
        document.getElementById('eventVideo').src = savedVideo;
      }

      parseGuests(savedGuests);
    };

    function parseGuests(rawText) {
      guestsList = [];
      const lines = rawText.split('\n');
      lines.forEach(line => {
        const parts = line.split(',');
        if (parts.length >= 2) {
          guestsList.push({
            name: parts[0].trim(),
            table: parts[1].trim()
          });
        }
      });
      document.getElementById('countTotal').innerText = guestsList.length;
    }

    // GESTIONARE TASTATURĂ VIRTUALĂ
    function pressKey(char) {
      currentQuery += char;
      renderSearch();
    }

    function backspaceKey() {
      currentQuery = currentQuery.slice(0, -1);
      renderSearch();
    }

    function clearSearch() {
      currentQuery = "";
      renderSearch();
    }

    function renderSearch() {
      const searchDisplay = document.getElementById('searchDisplay');
      const seatDisplay = document.getElementById('seatDisplay');
      const matchedName = document.getElementById('matchedName');
      const suggestionsBox = document.getElementById('suggestionsBox');

      if (!currentQuery) {
        searchDisplay.innerHTML = '<span class="placeholder-text">Tastați numele dvs. pe ecran</span>';
        seatDisplay.innerText = 'MASA: ---';
        matchedName.innerText = '';
        suggestionsBox.innerHTML = '';
        currentMatchedGuest = null;
        return;
      }

      searchDisplay.innerText = currentQuery;
      
      // Filtrare
      const q = currentQuery.toLowerCase();
      const results = guestsList.filter(g => g.name.toLowerCase().includes(q));

      // Afișează sugestii
      suggestionsBox.innerHTML = '';
      results.slice(0, 6).forEach(g => {
        const pill = document.createElement('div');
        pill.className = 'sug-pill';
        pill.innerText = g.name;
        pill.onclick = () => selectGuest(g);
        suggestionsBox.appendChild(pill);
      });

      if (results.length > 0) {
        selectGuest(results[0], false);
      } else {
        seatDisplay.innerText = 'GUEST NEGĂSIT';
        matchedName.innerText = '';
        currentMatchedGuest = null;
      }
    }

    function selectGuest(guest, fillText = true) {
      currentMatchedGuest = guest;
      document.getElementById('seatDisplay').innerText = guest.table.toUpperCase();
      document.getElementById('matchedName').innerText = "✓ " + guest.name;
      if (fillText) {
        currentQuery = guest.name.toUpperCase();
        document.getElementById('searchDisplay').innerText = currentQuery;
      }
    }

    function confirmArrival() {
      if (currentMatchedGuest) {
        arrivedGuests.add(currentMatchedGuest.name);
        document.getElementById('countArrived').innerText = arrivedGuests.size;
        alert(`${currentMatchedGuest.name} a fost bifat ca sosit la ${currentMatchedGuest.table}!`);
        clearSearch();
      }
    }

    // ÎNCĂRCARE IMAGINE ȘI VIDEO (PĂSTRATE STABIL ÎN CADRE)
    function setMapImage(src) {
      const img = document.getElementById('mapImage');
      img.src = src;
      img.style.display = 'block';
      document.getElementById('mapPlaceholder').style.display = 'none';
    }

    function loadLocalMap(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          setMapImage(dataUrl);
          try {
            localStorage.setItem('bm_map', dataUrl);
          } catch(err) {
            console.log("Fișierul este prea mare pentru salvare locală directă.");
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function loadLocalVideo(event) {
      const file = event.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.getElementById('eventVideo').src = url;
      }
    }

    // MODAL
    function openSettings() {
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      const title = document.getElementById('titleInput').value;
      const guests = document.getElementById('guestsInput').value;
      const videoUrl = document.getElementById('videoUrlInput').value;

      localStorage.setItem('bm_title', title);
      localStorage.setItem('bm_guests', guests);

      document.getElementById('eventTitleDisplay').innerText = title;
      parseGuests(guests);

      if (videoUrl) {
        document.getElementById('eventVideo').src = videoUrl;
        localStorage.setItem('bm_video', videoUrl);
      }

      closeSettings();
    }
  </script>
</body>
</html>
