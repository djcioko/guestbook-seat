<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EventKiosk - Find My Seat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #ffd700;
      --accent: #00ffcc;
      --bg: #0b0c10;
      --card-bg: rgba(22, 25, 32, 0.96);
      --red: #e63946;
      --green: #2ecc71;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    html, body { 
      width: 100vw; 
      height: 100vh; 
      background: var(--bg); 
      color: #fff; 
      overflow: hidden; 
      position: relative; 
    }

    #kioskApp {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 10px 16px 12px 16px;
      gap: 10px;
    }

    /* HEADER */
    header {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 8px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .event-title { 
      font-size: 1.3rem; 
      font-weight: 800; 
      color: var(--primary); 
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50%;
    }
    .stats-panel { display: flex; gap: 8px; font-size: 0.95rem; font-weight: 700; }
    .badge { padding: 4px 12px; border-radius: 20px; }
    .badge-arrived { background: rgba(46, 204, 113, 0.18); color: var(--green); border: 1px solid var(--green); }
    .badge-pending { background: rgba(230, 57, 70, 0.18); color: var(--red); border: 1px solid var(--red); }
    .badge-total { background: rgba(255, 255, 255, 0.1); color: #ddd; }

    /* CORP PRINCIPAL: DIMENSIUNI STRICT BLOCATE */
    .kiosk-body {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 14px;
    }

    /* STÂNGA: CĂUTARE + REZULTAT + TASTATURĂ */
    .search-section {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      gap: 8px;
    }

    .search-input {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px 14px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 10px;
      border: 2px solid var(--primary);
      background: #121419;
      color: #fff;
      outline: none;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .result-qr-row {
      flex: 0 0 135px;
      height: 135px;
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .result-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255,215,0,0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .res-name { 
      font-size: 1.2rem; 
      font-weight: 700; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .res-table { font-size: 1.8rem; font-weight: 900; color: var(--primary); margin: 2px 0; }
    .res-zone { font-size: 0.9rem; color: var(--accent); }
    .btn-checkin {
      margin-top: 6px;
      padding: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      text-transform: uppercase;
    }
    .btn-checkin:disabled { background: #444 !important; color: #aaa; cursor: default; }

    .qr-card-left {
      flex: 0 0 120px;
      width: 120px;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #qrcode { 
      background: #fff; 
      padding: 4px; 
      border-radius: 6px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .qr-mini-label { font-size: 0.68rem; color: var(--primary); font-weight: 800; margin-top: 4px; }

    /* LISTA REZULTATE CU SCROLL INTERN */
    .matches-container {
      position: relative;
      flex: 0 0 auto;
    }
    .matches-list {
      max-height: 90px;
      overflow-y: auto;
      background: #14171f;
      border-radius: 8px;
      display: none;
      border: 1px solid #383e4d;
    }
    .match-item {
      padding: 7px 12px;
      border-bottom: 1px solid #232733;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .match-item:hover, .match-item.active-item { background: rgba(255,215,0,0.22); color: #fff; }
    .match-item .status { float: right; font-size: 0.8rem; opacity: 0.85; }

    /* TASTATURĂ FĂRĂ DIACRITICE (CURATĂ, MARE) */
    .keyboard {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 5px;
      min-height: 0;
    }
    .kb-row { display: flex; gap: 5px; justify-content: center; width: 100%; flex: 1; }
    .key-btn {
      flex: 1;
      min-height: 42px;
      font-size: 1.15rem;
      font-weight: 800;
      border: none;
      border-radius: 6px;
      background: #232732;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 #111;
    }
    .key-btn:active { background: var(--primary); color: #000; transform: translateY(1px); }
    .key-btn.wide { flex: 2; background: #343a48; font-size: 0.9rem; }
    .key-btn.back { background: #b71c1c; flex: 1.6; font-size: 0.95rem; }

    /* DREAPTA: PLAYER + SCHIȚĂ (50% / 50% FIX) */
    .right-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      min-height: 0;
    }

    .video-card {
      flex: 1 1 50%;
      height: 50%;
      min-height: 0;
      background: #000;
      border-radius: 12px;
      border: 1px solid rgba(255,215,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .video-header-bar {
      position: absolute;
      top: 0; left: 0; width: 100%;
      z-index: 5;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .video-title-tag { font-size: 0.75rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .vol-btn {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .vol-btn.active-sound { background: var(--green); color: #000; border-color: var(--green); }

    .player-media-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #dedicatedVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #dedicatedImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .map-card {
      flex: 1 1 50%;
      height: 50%;
      min-height: 0;
      background: #14171f;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #salaImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    .no-map-msg {
      padding: 12px;
      color: #777;
      font-size: 0.85rem;
      text-align: center;
    }
    .map-badge-tag {
      position: absolute;
      top: 6px;
      left: 8px;
      background: rgba(0,0,0,0.75);
      color: var(--accent);
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 800;
      z-index: 2;
    }

    /* BARĂ ADMIN JOS */
    .admin-bar {
      position: fixed;
      bottom: 6px;
      left: 14px;
      z-index: 10;
      display: flex;
      gap: 6px;
      opacity: 0.35;
      transition: opacity 0.2s;
    }
    .admin-bar:hover { opacity: 1; }
    .btn-admin {
      background: #252834;
      color: #fff;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 700;
    }

    /* MODAL ADMIN */
    #adminModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }
    .admin-content {
      background: #181a20;
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 18px;
      width: 90%;
      max-width: 620px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .upload-box {
      background: #222632;
      border: 1px dashed #555;
      padding: 8px;
      border-radius: 6px;
      margin-top: 4px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.82rem; color: #bbb; margin-bottom: 3px; font-weight: 700; }
    .form-group input[type="text"], .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      background: #0d0f13;
      border: 1px solid #333;
      color: #fff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div id="kioskApp">
    <!-- Header -->
    <header>
      <div class="event-title" id="dispEventTitle">ALINA & RADU - NUNTĂ</div>
      <div class="stats-panel">
        <div class="badge badge-arrived" id="statArrived">SOSIȚI: 0</div>
        <div class="badge badge-pending" id="statRemaining">RĂMAȘI: 0</div>
        <div class="badge badge-total" id="statTotal">TOTAL: 0</div>
      </div>
    </header>

    <div class="kiosk-body">
      <!-- PARTEA STÂNGĂ -->
      <div class="search-section">
        <input type="text" id="searchInput" class="search-input" placeholder="Atingeți literele pentru nume..." autocomplete="off">

        <div class="result-qr-row">
          <!-- Card Rezultat -->
          <div class="result-card">
            <div class="res-name" id="resName">Tastați numele dvs. pe tastatură</div>
            <div class="res-table" id="resTable">MASA: ---</div>
            <div class="res-zone" id="resZone">Zona: ---</div>
            <button class="btn-checkin" id="btnCheckIn" onclick="confirmCheckIn()">✔ CONFIRMĂ PREZENȚA (AM SOSIT)</button>
          </div>

          <!-- QR Code -->
          <div class="qr-card-left">
            <div id="qrcode"></div>
            <div class="qr-mini-label">SCAN PE MOBIL</div>
          </div>
        </div>

        <div class="matches-container">
          <div class="matches-list" id="matchesList"></div>
        </div>

        <!-- TASTATURĂ FĂRĂ DIACRITICE -->
        <div class="keyboard">
          <!-- Rândul 1 (A - I) -->
          <div class="kb-row">
            <button class="key-btn" onclick="pressKey('A')">A</button>
            <button class="key-btn" onclick="pressKey('B')">B</button>
            <button class="key-btn" onclick="pressKey('C')">C</button>
            <button class="key-btn" onclick="pressKey('D')">D</button>
            <button class="key-btn" onclick="pressKey('E')">E</button>
            <button class="key-btn" onclick="pressKey('F')">F</button>
            <button class="key-btn" onclick="pressKey('G')">G</button>
            <button class="key-btn" onclick="pressKey('H')">H</button>
            <button class="key-btn" onclick="pressKey('I')">I</button>
          </div>
          <!-- Rândul 2 (J - R) -->
          <div class="kb-row">
            <button class="key-btn" onclick="pressKey('J')">J</button>
            <button class="key-btn" onclick="pressKey('K')">K</button>
            <button class="key-btn" onclick="pressKey('L')">L</button>
            <button class="key-btn" onclick="pressKey('M')">M</button>
            <button class="key-btn" onclick="pressKey('N')">N</button>
            <button class="key-btn" onclick="pressKey('O')">O</button>
            <button class="key-btn" onclick="pressKey('P')">P</button>
            <button class="key-btn" onclick="pressKey('Q')">Q</button>
            <button class="key-btn" onclick="pressKey('R')">R</button>
          </div>
          <!-- Rândul 3 (S - Z) -->
          <div class="kb-row">
            <button class="key-btn" onclick="pressKey('S')">S</button>
            <button class="key-btn" onclick="pressKey('T')">T</button>
            <button class="key-btn" onclick="pressKey('U')">U</button>
            <button class="key-btn" onclick="pressKey('V')">V</button>
            <button class="key-btn" onclick="pressKey('W')">W</button>
            <button class="key-btn" onclick="pressKey('X')">X</button>
            <button class="key-btn" onclick="pressKey('Y')">Y</button>
            <button class="key-btn" onclick="pressKey('Z')">Z</button>
          </div>
          <!-- Rândul 4 (Comenzi) -->
          <div class="kb-row">
            <button class="key-btn wide" onclick="pressKey(' ')">SPAȚIU</button>
            <button class="key-btn back" onclick="backspaceKey()">⌫ ȘTERGE</button>
            <button class="key-btn wide" onclick="clearSearch()">GOLIȚI</button>
          </div>
        </div>
      </div>

      <!-- PARTEA DREAPTĂ (Cadre Fixe) -->
      <div class="right-section">
        <div class="video-card">
          <div class="video-header-bar">
            <div class="video-title-tag">MOMENTE SPECIALE</div>
            <button class="vol-btn" id="btnToggleAudio" onclick="toggleVideoAudio()">🔇 SUNET OPRIT</button>
          </div>
          <div class="player-media-wrap">
            <video id="dedicatedVideo" autoplay loop muted playsinline></video>
            <img id="dedicatedImage" alt="Media">
          </div>
        </div>

        <div class="map-card">
          <div class="map-badge-tag">🗺 SCHIȚĂ SALĂ</div>
          <img id="salaImg" src="" alt="Schiță Restaurant">
          <div class="no-map-msg" id="noMapMsg">
            Fără schiță încărcată.<br>
            Apasă <b>⚙ Panou Control</b> și alege poza schiței.
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Butoane Admin -->
  <div class="admin-bar">
    <button class="btn-admin" onclick="openAdminModal()">⚙ Panou Control & Fișiere</button>
    <button class="btn-admin" onclick="toggleFullScreen()">⛶ Ecran Complet</button>
  </div>

  <!-- Modal Admin -->
  <div id="adminModal">
    <div class="admin-content">
      <h2 style="color:var(--primary); margin-bottom: 12px; font-size:1.25rem;">⚙ Panou Control Eveniment</h2>

      <div class="form-group">
        <label>Titlu Eveniment:</label>
        <input type="text" id="cfgTitle" value="ALINA & RADU - NUNTĂ">
      </div>

      <div class="form-group">
        <label>🎬 Video Loop sau Poză (Alege din dispozitiv):</label>
        <div class="upload-box">
          <input type="file" id="filePlayerInput" accept="video/*,image/*" onchange="handlePlayerUpload(event)">
          <div style="font-size:0.75rem; color:#aaa; margin-top:4px;">Sau URL extern:</div>
          <input type="text" id="cfgPlayerMedia" value="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" style="margin-top:4px;">
        </div>
      </div>

      <div class="form-group">
        <label>🗺 Poză Schiță Sală (Alege din dispozitiv):</label>
        <div class="upload-box">
          <input type="file" id="fileSalaInput" accept="image/*" onchange="handleSalaUpload(event)">
          <div style="font-size:0.75rem; color:#aaa; margin-top:4px;">Sau fișier local / URL:</div>
          <input type="text" id="cfgSalaImg" placeholder="schita.jpg" style="margin-top:4px;">
        </div>
      </div>

      <div class="form-group">
        <label>🔗 Link Cod QR (Cloud / Drive):</label>
        <input type="text" id="cfgCloudLink" value="https://drive.google.com">
      </div>

      <div class="form-group">
        <label>📋 Listă Invitați (Format: <b>Nume | Masa | Zona</b>):</label>
        <textarea id="cfgGuestList" rows="6">Popescu Ion | Masa 1 | Lângă ring, stânga
Popescu Elena | Masa 1 | Lângă ring, stânga
Ionescu Andrei | Masa 3 | Lângă bar
Radu Maria | Masa 2 | În fața scenei
Stan George | Masa 4 | Lângă geamuri
Vasilescu Dan | Masa 2 | În fața scenei</textarea>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top: 14px;">
        <button class="btn-admin" style="background:var(--green); color:#000; font-size:0.95rem; padding:8px 18px;" onclick="saveConfig()">✔ Salvează Setările</button>
        <button class="btn-admin" style="background:#555; font-size:0.95rem; padding:8px 18px;" onclick="closeAdminModal()">Închide</button>
      </div>
    </div>
  </div>

  <script>
    let guests = [];
    let currentSelectedIndex = -1;
    let autoResetTimer = null;
    let tempPlayerBlob = "";
    let tempSalaBlob = "";

    // Eliminare completă a diacriticelor pentru căutare flexibilă
    function cleanText(str) {
      if (!str) return "";
      return str.normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/ș|ş/gi, "s")
                .replace(/ț|ţ/gi, "t")
                .toUpperCase()
                .trim();
    }

    window.onload = function() {
      // Ascultă direct tastarea fizică de la laptop/tabletă
      document.getElementById('searchInput').addEventListener('input', function(e) {
        searchGuest(e.target.value);
        triggerAutoReset();
      });
      loadSavedConfig();
    };

    function loadSavedConfig() {
      const savedCfg = localStorage.getItem('kiosk_config_v4');
      const savedStatus = localStorage.getItem('kiosk_status_v4');
      let statusMap = {};
      if (savedStatus) {
        try { statusMap = JSON.parse(savedStatus); } catch(e) {}
      }

      if (savedCfg) {
        const cfg = JSON.parse(savedCfg);
        document.getElementById('dispEventTitle').innerText = cfg.title;
        document.getElementById('cfgTitle').value = cfg.title;
        document.getElementById('cfgCloudLink').value = cfg.cloudLink || 'https://drive.google.com';
        document.getElementById('cfgGuestList').value = cfg.guestRaw;
        document.getElementById('cfgPlayerMedia').value = cfg.playerMedia;
        document.getElementById('cfgSalaImg').value = cfg.salaImg;

        applyPlayerMedia(cfg.playerMedia);
        applySalaImage(cfg.salaImg);
        parseGuests(cfg.guestRaw, statusMap);
        renderQRCode(cfg.cloudLink);
      } else {
        parseGuests(document.getElementById('cfgGuestList').value, {});
        applyPlayerMedia(document.getElementById('cfgPlayerMedia').value);
        applySalaImage(document.getElementById('cfgSalaImg').value);
        renderQRCode(document.getElementById('cfgCloudLink').value);
      }
      updateStats();
    }

    function handlePlayerUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      tempPlayerBlob = URL.createObjectURL(file);
      applyPlayerMedia(tempPlayerBlob);
    }

    function applyPlayerMedia(src) {
      const video = document.getElementById('dedicatedVideo');
      const img = document.getElementById('dedicatedImage');
      if (!src) return;

      const isImg = /\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(src) || (src.startsWith('blob:') && !src.includes('video'));
      if (isImg) {
        video.style.display = 'none';
        video.pause();
        img.style.display = 'block';
        img.src = src;
      } else {
        img.style.display = 'none';
        video.style.display = 'block';
        video.src = src;
        video.play().catch(()=>{});
      }
    }

    function toggleVideoAudio() {
      const video = document.getElementById('dedicatedVideo');
      const btn = document.getElementById('btnToggleAudio');
      if (video.muted) {
        video.muted = false;
        btn.innerText = "🔊 SUNET ACTIV";
        btn.classList.add("active-sound");
      } else {
        video.muted = true;
        btn.innerText = "🔇 SUNET OPRIT";
        btn.classList.remove("active-sound");
      }
    }

    function handleSalaUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      tempSalaBlob = URL.createObjectURL(file);
      applySalaImage(tempSalaBlob);
    }

    function applySalaImage(src) {
      const img = document.getElementById('salaImg');
      const noMapMsg = document.getElementById('noMapMsg');
      if (src && src.trim() !== "") {
        img.src = src;
        img.style.display = 'block';
        noMapMsg.style.display = 'none';
      } else {
        img.style.display = 'none';
        noMapMsg.style.display = 'block';
      }
    }

    function saveConfig() {
      const finalPlayer = tempPlayerBlob || document.getElementById('cfgPlayerMedia').value.trim();
      const finalSala = tempSalaBlob || document.getElementById('cfgSalaImg').value.trim();

      const cfg = {
        title: document.getElementById('cfgTitle').value,
        playerMedia: finalPlayer,
        salaImg: finalSala,
        cloudLink: document.getElementById('cfgCloudLink').value,
        guestRaw: document.getElementById('cfgGuestList').value
      };

      try {
        localStorage.setItem('kiosk_config_v4', JSON.stringify(cfg));
      } catch(e) {}

      loadSavedConfig();
      closeAdminModal();
      clearSearch();
    }

    function parseGuests(rawText, statusMap) {
      guests = [];
      if (!rawText) return;
      
      const lines = rawText.split(/\r?\n/);
      lines.forEach(line => {
        line = line.trim();
        if (!line) return;
        
        const parts = line.split('|').map(p => p.trim());
        if (parts.length >= 1 && parts[0] !== '') {
          const name = parts[0];
          const table = parts[1] || 'Fără masă';
          const zone = parts[2] || 'Sală Principală';
          guests.push({
            name: name,
            table: table,
            zone: zone,
            arrived: statusMap[name] === true
          });
        }
      });
      updateStats();
    }

    function saveStatus() {
      const statusMap = {};
      guests.forEach(g => { statusMap[g.name] = g.arrived; });
      localStorage.setItem('kiosk_status_v4', JSON.stringify(statusMap));
    }

    function renderQRCode(url) {
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      if (typeof QRCode !== 'undefined') {
        new QRCode(qrContainer, {
          text: url || 'https://drive.google.com',
          width: 82,
          height: 82,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    function pressKey(char) {
      const input = document.getElementById('searchInput');
      input.value += char;
      searchGuest(input.value);
      triggerAutoReset();
    }

    function backspaceKey() {
      const input = document.getElementById('searchInput');
      input.value = input.value.slice(0, -1);
      searchGuest(input.value);
      triggerAutoReset();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      currentSelectedIndex = -1;
      document.getElementById('resName').innerText = 'Tastați numele dvs. pe tastatură';
      document.getElementById('resTable').innerText = 'MASA: ---';
      document.getElementById('resZone').innerText = 'Zona: ---';
      document.getElementById('btnCheckIn').style.display = 'none';
      const listEl = document.getElementById('matchesList');
      listEl.style.display = 'none';
      listEl.innerHTML = '';
    }

    function searchGuest(query) {
      const cleanQ = cleanText(query);
      const listEl = document.getElementById('matchesList');
      listEl.innerHTML = '';
      listEl.style.display = 'none';

      if (!cleanQ) {
        clearSearch();
        return;
      }

      // Căutare independentă de diacritice
      const matches = guests
        .map((g, idx) => ({ ...g, idx }))
        .filter(g => cleanText(g.name).includes(cleanQ));

      if (matches.length === 0) {
        document.getElementById('resName').innerText = 'Numele nu a fost găsit...';
        document.getElementById('resTable').innerText = 'MASA: ---';
        document.getElementById('resZone').innerText = 'Verificați literele introduse';
        document.getElementById('btnCheckIn').style.display = 'none';
        return;
      }

      if (matches.length === 1) {
        selectGuest(matches[0].idx);
      } else {
        listEl.style.display = 'block';
        matches.forEach(m => {
          const div = document.createElement('div');
          div.className = 'match-item' + (m.idx === currentSelectedIndex ? ' active-item' : '');
          div.innerHTML = `${m.name} <span class="status">${m.arrived ? '✓ Sosit' : '— În așteptare'}</span>`;
          div.onclick = () => selectGuest(m.idx);
          listEl.appendChild(div);
        });
        selectGuest(matches[0].idx);
      }
    }

    function selectGuest(idx) {
      currentSelectedIndex = idx;
      const g = guests[idx];
      document.getElementById('resName').innerText = g.name;
      document.getElementById('resTable').innerText = g.table;
      document.getElementById('resZone').innerText = 'Zona: ' + g.zone;

      const btn = document.getElementById('btnCheckIn');
      btn.style.display = 'block';
      if (g.arrived) {
        btn.innerText = '✓ DEJA CONFIRMAT';
        btn.disabled = true;
      } else {
        btn.innerText = '✔ CONFIRMĂ PREZENȚA (AM SOSIT)';
        btn.disabled = false;
      }
    }

    function confirmCheckIn() {
      if (currentSelectedIndex !== -1) {
        guests[currentSelectedIndex].arrived = true;
        saveStatus();
        updateStats();
        const btn = document.getElementById('btnCheckIn');
        btn.innerText = '✓ BINE AȚI VENIT!';
        btn.disabled = true;
        setTimeout(clearSearch, 3000);
      }
    }

    function updateStats() {
      const arrived = guests.filter(g => g.arrived).length;
      const total = guests.length;
      const remaining = Math.max(0, total - arrived);
      document.getElementById('statArrived').innerText = `SOSIȚI: ${arrived}`;
      document.getElementById('statRemaining').innerText = `RĂMAȘI: ${remaining}`;
      document.getElementById('statTotal').innerText = `TOTAL: ${total}`;
    }

    function triggerAutoReset() {
      if (autoResetTimer) clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(clearSearch, 15000);
    }

    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
