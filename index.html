<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EventKiosk Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #ffd700;
      --accent: #00ffcc;
      --bg: #0b0c10;
      --card-bg: rgba(22, 25, 32, 0.96);
      --green: #2ecc71;
      --red: #e63946;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100vw; height: 100vh; background: var(--bg); color: #fff; overflow: hidden; }
    #kioskApp { width: 100%; height: 100%; display: flex; flex-direction: column; padding: 8px 12px 10px; gap: 8px; }
    header { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 6px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .event-title { font-size: 1.25rem; font-weight: 800; color: var(--primary); max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stats-panel { display: flex; gap: 6px; font-size: 0.9rem; font-weight: 700; }
    .badge { padding: 3px 10px; border-radius: 16px; }
    .badge-arrived { background: rgba(46,204,113,0.18); color: var(--green); border: 1px solid var(--green); }
    .badge-pending { background: rgba(230,57,70,0.18); color: var(--red); border: 1px solid var(--red); }
    .badge-total { background: rgba(255,255,255,0.1); color: #ddd; }
    .kiosk-body { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
    .search-section { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: 6px; }
    .search-input { flex: 0 0 auto; width: 100%; padding: 8px 12px; font-size: 1.15rem; font-weight: 700; border-radius: 8px; border: 2px solid var(--primary); background: #121419; color: #fff; outline: none; }
    .result-qr-row { flex: 0 0 120px; height: 120px; display: flex; gap: 8px; }
    .result-card { flex: 1; background: var(--card-bg); border-radius: 10px; padding: 8px 12px; border: 1px solid rgba(255,215,0,0.35); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .res-name { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .res-table { font-size: 1.65rem; font-weight: 900; color: var(--primary); margin: 1px 0; }
    .res-zone { font-size: 0.85rem; color: var(--accent); }
    .btn-checkin { margin-top: 4px; padding: 6px; font-size: 0.85rem; font-weight: 800; background: var(--green); color: #000; border: none; border-radius: 6px; cursor: pointer; display: none; }
    .btn-checkin:disabled { background: #444 !important; color: #aaa; }
    .qr-card-left { flex: 0 0 110px; background: var(--card-bg); border-radius: 10px; padding: 4px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #qrcode { background: #fff; padding: 3px; border-radius: 6px; }
    .qr-mini-label { font-size: 0.65rem; color: var(--primary); font-weight: 800; margin-top: 2px; }
    /* Lista orizontală de nume asemănătoare (cuburi) */
    .matches-horizontal {
      flex: 0 0 auto;
      display: none;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 6px;
      padding: 4px 0;
      max-height: 70px;
    }
    .match-cube {
      flex: 0 0 auto;
      min-width: 140px;
      max-width: 180px;
      background: #1c2029;
      border: 1px solid #3a4150;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .match-cube:hover, .match-cube.active { background: rgba(255,215,0,0.25); border-color: var(--primary); }
    .match-cube .st { font-size: 0.7rem; opacity: 0.75; display: block; }
    .keyboard { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; min-height: 0; }
    .kb-row { display: flex; gap: 4px; width: 100%; flex: 1; }
    .key-btn { flex: 1; min-height: 36px; font-size: 1.05rem; font-weight: 800; border: none; border-radius: 6px; background: #232732; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #111; }
    .key-btn:active { background: var(--primary); color: #000; transform: translateY(1px); }
    .key-btn.wide { flex: 2.2; background: #343a48; font-size: 0.85rem; }
    .key-btn.back { background: #b71c1c; flex: 1.5; font-size: 0.85rem; }
    .right-section { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
    .video-card, .map-card { flex: 1 1 50%; min-height: 0; border-radius: 10px; position: relative; overflow: hidden; background: #000; }
    .video-card { border: 1px solid rgba(255,215,0,0.35); }
    .map-card { background: #14171f; border: 1px solid rgba(255,255,255,0.1); }
    .video-header-bar { position: absolute; top: 0; left: 0; width: 100%; z-index: 5; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; }
    .video-title-tag { font-size: 0.7rem; font-weight: 800; color: var(--primary); }
    .vol-btn { background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 5px; padding: 2px 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
    .vol-btn.active-sound { background: var(--green); color: #000; }
    #dedicatedVideo, #dedicatedImage { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    #dedicatedImage { object-fit: contain; display: none; }
    #salaImg { width: 100%; height: 100%; object-fit: contain; display: none; }
    .no-map-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #777; font-size: 0.8rem; text-align: center; padding: 10px; }
    .map-badge-tag { position: absolute; top: 4px; left: 6px; background: rgba(0,0,0,0.7); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; z-index: 2; }
    .fs-btn { position: fixed; top: 6px; right: 6px; z-index: 30; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 3px 7px; font-size: 0.7rem; cursor: pointer; opacity: 0.75; }
    .fs-btn:hover { opacity: 1; }
    .admin-bar { position: fixed; bottom: 4px; left: 10px; z-index: 10; display: flex; gap: 5px; opacity: 0.4; transition: opacity 0.2s; }
    .admin-bar:hover { opacity: 1; }
    .btn-admin { background: #252834; color: #fff; border: 1px solid #444; padding: 4px 8px; border-radius: 5px; font-size: 0.7rem; cursor: pointer; font-weight: 700; }
    #adminModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 999; align-items: center; justify-content: center; }
    .admin-content { background: #181a20; border: 1px solid var(--primary); border-radius: 12px; padding: 16px; width: 90%; max-width: 600px; max-height: 88vh; overflow-y: auto; }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 0.78rem; color: #bbb; margin-bottom: 2px; font-weight: 700; }
    .form-group input, .form-group textarea { width: 100%; padding: 6px 8px; border-radius: 6px; background: #0d0f13; border: 1px solid #333; color: #fff; font-size: 0.85rem; }
    .upload-box { background: #222632; border: 1px dashed #555; padding: 6px; border-radius: 6px; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="kioskApp">
    <header>
      <div class="event-title" id="dispEventTitle">ALINA & RADU - NUNTĂ</div>
      <div class="stats-panel">
        <div class="badge badge-arrived" id="statArrived">SOSIȚI: 0</div>
        <div class="badge badge-pending" id="statRemaining">RĂMAȘI: 0</div>
        <div class="badge badge-total" id="statTotal">TOTAL: 0</div>
      </div>
    </header>
    <div class="kiosk-body">
      <div class="search-section">
        <input type="text" id="searchInput" class="search-input" placeholder="Tastați numele..." autocomplete="off">
        <div class="result-qr-row">
          <div class="result-card">
            <div class="res-name" id="resName">Tastați numele pe tastatură</div>
            <div class="res-table" id="resTable">MASA: ---</div>
            <div class="res-zone" id="resZone">Zona: ---</div>
            <button class="btn-checkin" id="btnCheckIn" onclick="confirmCheckIn()">✔ CONFIRMĂ PREZENȚA</button>
          </div>
          <div class="qr-card-left">
            <div id="qrcode"></div>
            <div class="qr-mini-label">SCAN</div>
          </div>
        </div>
        <div class="matches-horizontal" id="matchesList"></div>
        <div class="keyboard">
          <div class="kb-row">
            <button class="key-btn" onclick="pressKey('A')">A</button><button class="key-btn" onclick="pressKey('B')">B</button><button class="key-btn" onclick="pressKey('C')">C</button><button class="key-btn" onclick="pressKey('D')">D</button><button class="key-btn" onclick="pressKey('E')">E</button><button class="key-btn" onclick="pressKey('F')">F</button><button class="key-btn" onclick="pressKey('G')">G</button><button class="key-btn" onclick="pressKey('H')">H</button><button class="key-btn" onclick="pressKey('I')">I</button>
          </div>
          <div class="kb-row">
            <button class="key-btn" onclick="pressKey('J')">J</button><button class="key-btn" onclick="pressKey('K')">K</button><button class="key-btn" onclick="pressKey('L')">L</button><button class="key-btn" onclick="pressKey('M')">M</button><button class="key-btn" onclick="pressKey('N')">N</button><button class="key-btn" onclick="pressKey('O')">O</button><button class="key-btn" onclick="pressKey('P')">P</button><button class="key-btn" onclick="pressKey('Q')">Q</button><button class="key-btn" onclick="pressKey('R')">R</button>
          </div>
          <div class="kb-row">
            <button class="key-btn" onclick="pressKey('S')">S</button><button class="key-btn" onclick="pressKey('T')">T</button><button class="key-btn" onclick="pressKey('U')">U</button><button class="key-btn" onclick="pressKey('V')">V</button><button class="key-btn" onclick="pressKey('W')">W</button><button class="key-btn" onclick="pressKey('X')">X</button><button class="key-btn" onclick="pressKey('Y')">Y</button><button class="key-btn" onclick="pressKey('Z')">Z</button>
          </div>
          <div class="kb-row">
            <button class="key-btn wide" onclick="pressKey(' ')">SPAȚIU</button>
            <button class="key-btn back" onclick="backspaceKey()">⌫</button>
            <button class="key-btn wide" onclick="clearSearch()">GOLIȚI</button>
          </div>
        </div>
      </div>
      <div class="right-section">
        <div class="video-card">
          <div class="video-header-bar">
            <div class="video-title-tag">MOMENTE</div>
            <button class="vol-btn" id="btnToggleAudio" onclick="toggleVideoAudio()">🔇</button>
          </div>
          <video id="dedicatedVideo" autoplay loop muted playsinline></video>
          <img id="dedicatedImage" alt="">
        </div>
        <div class="map-card">
          <div class="map-badge-tag">🗺 SCHIȚĂ</div>
          <img id="salaImg" src="" alt="">
          <div class="no-map-msg" id="noMapMsg">Încarcă schița din Panou Control</div>
        </div>
      </div>
    </div>
  </div>
  <button class="fs-btn" onclick="toggleFullScreen()">⛶</button>
  <div class="admin-bar">
    <button class="btn-admin" onclick="openAdminModal()">⚙ Panou</button>
    <button class="btn-admin" onclick="toggleFullScreen()">⛶ Full</button>
  </div>
  <div id="adminModal">
    <div class="admin-content">
      <h2 style="color:var(--primary); margin-bottom:10px; font-size:1.15rem;">Panou Control</h2>
      <div class="form-group"><label>Titlu:</label><input type="text" id="cfgTitle" value="ALINA & RADU - NUNTĂ"></div>
      <div class="form-group">
        <label>Video / Poză sus:</label>
        <div class="upload-box">
          <input type="file" id="filePlayerInput" accept="video/*,image/*" onchange="handlePlayerUpload(event)">
          <input type="text" id="cfgPlayerMedia" value="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" style="margin-top:4px;">
        </div>
      </div>
      <div class="form-group">
        <label>Schiță sală:</label>
        <div class="upload-box">
          <input type="file" id="fileSalaInput" accept="image/*" onchange="handleSalaUpload(event)">
          <input type="text" id="cfgSalaImg" placeholder="sau link" style="margin-top:4px;">
        </div>
      </div>
      <div class="form-group"><label>Link QR:</label><input type="text" id="cfgCloudLink" value="https://drive.google.com"></div>
      <div class="form-group"><label>Listă invitați (Nume | Masa | Zona):</label><textarea id="cfgGuestList" rows="5">Popescu Ion | Masa 1 | Lângă ring
Popescu Elena | Masa 1 | Lângă ring
Ionescu Andrei | Masa 3 | Lângă bar
Radu Maria | Masa 2 | Scenă
Stan George | Masa 4 | Geamuri</textarea></div>
      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:12px; flex-wrap:wrap;">
        <button class="btn-admin" style="background:var(--green); color:#000; padding:8px 14px;" onclick="saveConfig()">✔ Salvează</button>
        <button class="btn-admin" style="background:#c0392b; padding:8px 14px;" onclick="resetEvent()">🔄 Reset Eveniment</button>
        <button class="btn-admin" style="background:#555; padding:8px 14px;" onclick="closeAdminModal()">Închide</button>
      </div>
    </div>
  </div>
  <script>
    let guests = [];
    let currentSelectedIndex = -1;
    let autoResetTimer = null;
    let activePlayerMedia = "";
    let activeSalaImage = "";
    function cleanText(str) {
      if (!str) return "";
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ș|ş/gi, "s").replace(/ț|ţ/gi, "t").toUpperCase().trim();
    }
    window.onload = function() {
      document.getElementById('searchInput').addEventListener('input', function(e) {
        searchGuest(e.target.value);
        triggerAutoReset();
      });
      loadSavedConfig();
    };
    function loadSavedConfig() {
      const savedCfg = localStorage.getItem('kiosk_config_v6');
      const savedStatus = localStorage.getItem('kiosk_status_v6');
      let statusMap = {};
      if (savedStatus) try { statusMap = JSON.parse(savedStatus); } catch(e) {}
      if (savedCfg) {
        const cfg = JSON.parse(savedCfg);
        document.getElementById('dispEventTitle').innerText = cfg.title;
        document.getElementById('cfgTitle').value = cfg.title;
        document.getElementById('cfgCloudLink').value = cfg.cloudLink || 'https://drive.google.com';
        document.getElementById('cfgGuestList').value = cfg.guestRaw;
        activePlayerMedia = cfg.playerMedia || "https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4";
        activeSalaImage = cfg.salaImg || "";
        document.getElementById('cfgPlayerMedia').value = activePlayerMedia.startsWith('data:') ? '[încărcat]' : activePlayerMedia;
        document.getElementById('cfgSalaImg').value = activeSalaImage.startsWith('data:') ? '[încărcat]' : activeSalaImage;
        applyPlayerMedia(activePlayerMedia);
        applySalaImage(activeSalaImage);
        parseGuests(cfg.guestRaw, statusMap);
        renderQRCode(cfg.cloudLink);
      } else {
        activePlayerMedia = document.getElementById('cfgPlayerMedia').value;
        parseGuests(document.getElementById('cfgGuestList').value, {});
        applyPlayerMedia(activePlayerMedia);
        applySalaImage("");
        renderQRCode(document.getElementById('cfgCloudLink').value);
      }
      updateStats();
    }
    function handlePlayerUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.type.startsWith('video')) {
        activePlayerMedia = URL.createObjectURL(file);
        applyPlayerMedia(activePlayerMedia);
      } else {
        const reader = new FileReader();
        reader.onload = e => { activePlayerMedia = e.target.result; applyPlayerMedia(activePlayerMedia); };
        reader.readAsDataURL(file);
      }
    }
    function applyPlayerMedia(src) {
      const video = document.getElementById('dedicatedVideo');
      const img = document.getElementById('dedicatedImage');
      if (!src) return;
      const isImg = src.startsWith('data:image') || /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(src);
      if (isImg) {
        video.style.display = 'none'; video.pause();
        img.style.display = 'block'; img.src = src;
      } else {
        img.style.display = 'none';
        video.style.display = 'block'; video.src = src; video.play().catch(()=>{});
      }
    }
    function toggleVideoAudio() {
      const video = document.getElementById('dedicatedVideo');
      const btn = document.getElementById('btnToggleAudio');
      if (video.style.display === 'none') return;
      video.muted = !video.muted;
      if (video.muted) { btn.innerText = "🔇"; btn.classList.remove("active-sound"); }
      else { btn.innerText = "🔊"; btn.classList.add("active-sound"); }
    }
    function handleSalaUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => { activeSalaImage = e.target.result; applySalaImage(activeSalaImage); };
      reader.readAsDataURL(file);
    }
    function applySalaImage(src) {
      const img = document.getElementById('salaImg');
      const msg = document.getElementById('noMapMsg');
      if (src && src.trim() && src !== '[încărcat]') {
        img.src = src; img.style.display = 'block'; msg.style.display = 'none';
      } else { img.style.display = 'none'; msg.style.display = 'flex'; }
    }
    function saveConfig() {
      const manualPlayer = document.getElementById('cfgPlayerMedia').value.trim();
      const manualSala = document.getElementById('cfgSalaImg').value.trim();
      if (manualPlayer && manualPlayer !== '[încărcat]') activePlayerMedia = manualPlayer;
      if (manualSala && manualSala !== '[încărcat]') activeSalaImage = manualSala;
      const cfg = {
        title: document.getElementById('cfgTitle').value,
        playerMedia: activePlayerMedia,
        salaImg: activeSalaImage,
        cloudLink: document.getElementById('cfgCloudLink').value,
        guestRaw: document.getElementById('cfgGuestList').value
      };
      try { localStorage.setItem('kiosk_config_v6', JSON.stringify(cfg)); } catch(e) {}
      applyPlayerMedia(activePlayerMedia);
      applySalaImage(activeSalaImage);
      parseGuests(cfg.guestRaw, JSON.parse(localStorage.getItem('kiosk_status_v6') || '{}'));
      renderQRCode(cfg.cloudLink);
      closeAdminModal();
      clearSearch();
    }
    function resetEvent() {
      if (!confirm("Ștergi toate check-in-urile? Lista de invitați rămâne.")) return;
      localStorage.removeItem('kiosk_status_v6');
      guests.forEach(g => g.arrived = false);
      updateStats();
      clearSearch();
      alert("Eveniment resetat. Toți invitații sunt din nou în așteptare.");
    }
    function parseGuests(rawText, statusMap) {
      guests = [];
      if (!rawText) return;
      rawText.split(/\r?\n/).forEach(line => {
        line = line.trim(); if (!line) return;
        const parts = line.split('|').map(p => p.trim());
        if (parts[0]) guests.push({ name: parts[0], table: parts[1] || '—', zone: parts[2] || 'Sală', arrived: statusMap[parts[0]] === true });
      });
      updateStats();
    }
    function saveStatus() {
      const m = {}; guests.forEach(g => m[g.name] = g.arrived);
      try { localStorage.setItem('kiosk_status_v6', JSON.stringify(m)); } catch(e) {}
    }
    function renderQRCode(url) {
      const c = document.getElementById('qrcode'); c.innerHTML = '';
      if (typeof QRCode !== 'undefined') new QRCode(c, { text: url || 'https://example.com', width: 76, height: 76, colorDark: "#000", colorLight: "#fff", correctLevel: QRCode.CorrectLevel.M });
    }
    function pressKey(ch) { const i = document.getElementById('searchInput'); i.value += ch; searchGuest(i.value); triggerAutoReset(); }
    function backspaceKey() { const i = document.getElementById('searchInput'); i.value = i.value.slice(0,-1); searchGuest(i.value); triggerAutoReset(); }
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      currentSelectedIndex = -1;
      document.getElementById('resName').innerText = 'Tastați numele pe tastatură';
      document.getElementById('resTable').innerText = 'MASA: ---';
      document.getElementById('resZone').innerText = 'Zona: ---';
      document.getElementById('btnCheckIn').style.display = 'none';
      const list = document.getElementById('matchesList');
      list.style.display = 'none'; list.innerHTML = '';
    }
    function searchGuest(query) {
      const q = cleanText(query);
      const list = document.getElementById('matchesList');
      list.innerHTML = ''; list.style.display = 'none';
      if (!q) { clearSearch(); return; }
      const matches = guests.map((g,idx)=>({...g,idx})).filter(g => cleanText(g.name).includes(q));
      if (matches.length === 0) {
        document.getElementById('resName').innerText = 'Nu s-a găsit...';
        document.getElementById('resTable').innerText = 'MASA: ---';
        document.getElementById('resZone').innerText = 'Verificați';
        document.getElementById('btnCheckIn').style.display = 'none';
        return;
      }
      if (matches.length > 1) {
        list.style.display = 'flex';
        matches.forEach(m => {
          const d = document.createElement('div');
          d.className = 'match-cube' + (m.idx === currentSelectedIndex ? ' active' : '');
          d.innerHTML = m.name + '<span class="st">' + (m.arrived ? '✓' : '—') + '</span>';
          d.onclick = () => selectGuest(m.idx);
          list.appendChild(d);
        });
      }
      selectGuest(matches[0].idx);
    }
    function selectGuest(idx) {
      currentSelectedIndex = idx;
      const g = guests[idx];
      document.getElementById('resName').innerText = g.name;
      document.getElementById('resTable').innerText = g.table;
      document.getElementById('resZone').innerText = 'Zona: ' + g.zone;
      const btn = document.getElementById('btnCheckIn');
      btn.style.display = 'block';
      if (g.arrived) { btn.innerText = '✓ DEJA SOSIT'; btn.disabled = true; }
      else { btn.innerText = '✔ CONFIRMĂ PREZENȚA'; btn.disabled = false; }
    }
    function confirmCheckIn() {
      if (currentSelectedIndex < 0) return;
      guests[currentSelectedIndex].arrived = true;
      saveStatus(); updateStats();
      const btn = document.getElementById('btnCheckIn');
      btn.innerText = '✓ BINE AȚI VENIT!'; btn.disabled = true;
      setTimeout(clearSearch, 2800);
    }
    function updateStats() {
      const arr = guests.filter(g => g.arrived).length;
      const tot = guests.length;
      document.getElementById('statArrived').innerText = `SOSIȚI: ${arr}`;
      document.getElementById('statRemaining').innerText = `RĂMAȘI: ${Math.max(0, tot - arr)}`;
      document.getElementById('statTotal').innerText = `TOTAL: ${tot}`;
    }
    function triggerAutoReset() { if (autoResetTimer) clearTimeout(autoResetTimer); autoResetTimer = setTimeout(clearSearch, 14000); }
    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else if (document.exitFullscreen) document.exitFullscreen();
    }
  </script>
</body>
</html>
