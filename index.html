<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EventKiosk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--gold:#ffd700;--cyan:#00ffcc;--bg:#0a0e14;--card:#121820;--green:#2ecc71;--red:#e74c3c;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
html,body{width:100vw;height:100vh;background:var(--bg);color:#fff;overflow:hidden;}
#app{width:100%;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;gap:8px;}
header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.08);}
.title{font-size:1.35rem;font-weight:800;color:#ff8c00;letter-spacing:.5px;}
.stats{display:flex;gap:10px;font-weight:700;font-size:.95rem;}
.badge{padding:4px 12px;border-radius:20px;}
.b-arr{background:rgba(46,204,113,.2);color:var(--green);border:1px solid var(--green);}
.b-tot{background:rgba(255,255,255,.1);color:#ddd;}
.body{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:12px;min-height:0;}
.left{display:flex;flex-direction:column;gap:8px;min-height:0;}
.search{width:100%;padding:10px 14px;font-size:1.2rem;font-weight:700;border-radius:8px;border:2px solid var(--gold);background:#0d1117;color:#fff;outline:none;}
.result-row{display:flex;gap:8px;align-items:stretch;}
.result{flex:1;background:var(--card);border-radius:12px;padding:12px 16px;border:1px solid rgba(255,215,0,.3);display:flex;flex-direction:column;justify-content:center;min-height:110px;}
.r-name{font-size:1.6rem;font-weight:800;text-align:center;}
.r-table{font-size:1.9rem;font-weight:900;color:var(--gold);text-align:center;margin:4px 0;}
.r-zone{font-size:.95rem;color:var(--cyan);text-align:center;}
.prompt-btn{display:block;width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:1.3rem;font-weight:800;cursor:pointer;text-align:center;margin-bottom:6px;}
.qr-left{flex:0 0 110px;background:#fff;border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.qr-left canvas,.qr-left img{display:block;}
.qr-label{font-size:.65rem;color:#000;font-weight:800;margin-top:2px;text-align:center;}
.matches{display:none;flex-wrap:wrap;gap:6px;max-height:80px;overflow-y:auto;}
.cube{background:#1a2230;border:1px solid #3a4555;border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap;}
.cube:hover,.cube.on{background:rgba(255,215,0,.25);border-color:var(--gold);}
.kb{display:flex;flex-direction:column;gap:5px;margin-top:auto;}
.row{display:flex;gap:5px;}
.key{flex:1;height:48px;font-size:1.15rem;font-weight:800;border:none;border-radius:8px;background:#1e3a5f;color:#fff;cursor:pointer;}
.key:active{background:var(--gold);color:#000;}
.key.w{flex:2.2;background:#2a4a70;}
.key.del{background:#8b0000;}
.right{display:flex;flex-direction:column;gap:8px;min-height:0;}
.vid,.map{flex:1;border-radius:12px;overflow:hidden;position:relative;background:#000;min-height:0;}
.vid{border:1px solid rgba(255,215,0,.35);}
.map{border:1px solid rgba(255,255,255,.1);background:#111;}
.vbar{position:absolute;top:0;left:0;right:0;padding:6px 10px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);display:flex;justify-content:space-between;z-index:2;}
.vtag{font-size:.75rem;font-weight:800;color:var(--gold);}
.vol{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:2px 8px;font-size:.75rem;cursor:pointer;}
.vol.on{background:var(--green);color:#000;}
#v,#imgv{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
#imgv{display:none;object-fit:contain;}
#mapimg{width:100%;height:100%;object-fit:contain;display:none;}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:.85rem;text-align:center;padding:10px;}
.mtag{position:absolute;top:6px;left:8px;background:rgba(0,0,0,.7);color:var(--cyan);padding:3px 8px;border-radius:6px;font-size:.7rem;font-weight:800;z-index:2;}
.fs{position:fixed;top:8px;right:8px;z-index:40;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 8px;font-size:.75rem;cursor:pointer;opacity:.8;}
.fs:hover{opacity:1;}
.admin{position:fixed;bottom:6px;left:10px;z-index:30;opacity:.45;transition:.2s;}
.admin:hover{opacity:1;}
.abtn{background:#252a35;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:6px;font-size:.78rem;cursor:pointer;font-weight:700;}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center;}
.box{background:#161a22;border:1px solid var(--gold);border-radius:14px;padding:18px;width:92%;max-width:640px;max-height:90vh;overflow-y:auto;}
.fg{margin-bottom:10px;}
.fg label{display:block;font-size:.8rem;color:#aaa;margin-bottom:3px;font-weight:700;}
.fg input,.fg textarea{width:100%;padding:8px 10px;border-radius:6px;background:#0c0e12;border:1px solid #333;color:#fff;font-size:.9rem;}
.guest-mode .admin,.guest-mode .fs{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title" id="title">BOTEZ MORGAN - 18 OCTOMBRIE</div>
    <div class="stats">
      <div class="badge b-arr" id="arr">SOSIȚI: 0</div>
      <div class="badge b-tot" id="tot">TOTAL: 0</div>
    </div>
  </header>
  <div class="body">
    <div class="left">
      <button class="prompt-btn" onclick="focusSearch()">Tastați numele</button>
      <input id="q" class="search" placeholder="" autocomplete="off" readonly>
      <div class="result-row">
        <div class="result">
          <div class="r-name" id="rn">Tastați pe tastatură</div>
          <div class="r-table" id="rt">MASA: ---</div>
          <div class="r-zone" id="rz"></div>
          <button id="chk" onclick="check()" style="display:none;margin-top:8px;padding:8px;background:var(--green);border:none;border-radius:8px;font-weight:800;cursor:pointer;">Sosir ✓</button>
        </div>
        <div class="qr-left" id="qr"></div>
      </div>
      <div class="matches" id="matches"></div>
      <div class="kb">
        <div class="row">
          <button class="key" onclick="k('Q')">Q</button><button class="key" onclick="k('W')">W</button><button class="key" onclick="k('E')">E</button><button class="key" onclick="k('R')">R</button><button class="key" onclick="k('T')">T</button><button class="key" onclick="k('Y')">Y</button><button class="key" onclick="k('U')">U</button><button class="key" onclick="k('I')">I</button><button class="key" onclick="k('O')">O</button><button class="key" onclick="k('P')">P</button><button class="key" onclick="k('Ă')">Ă</button><button class="key" onclick="k('Î')">Î</button>
        </div>
        <div class="row">
          <button class="key" onclick="k('A')">A</button><button class="key" onclick="k('S')">S</button><button class="key" onclick="k('D')">D</button><button class="key" onclick="k('F')">F</button><button class="key" onclick="k('G')">G</button><button class="key" onclick="k('H')">H</button><button class="key" onclick="k('J')">J</button><button class="key" onclick="k('K')">K</button><button class="key" onclick="k('L')">L</button><button class="key" onclick="k('Ș')">Ș</button><button class="key" onclick="k('Ț')">Ț</button><button class="key" onclick="k('Â')">Â</button>
        </div>
        <div class="row">
          <button class="key w" onclick="clearQ()">Golește</button><button class="key" onclick="k('Z')">Z</button><button class="key" onclick="k('X')">X</button><button class="key" onclick="k('C')">C</button><button class="key" onclick="k('V')">V</button><button class="key" onclick="k('B')">B</button><button class="key" onclick="k('N')">N</button><button class="key" onclick="k('M')">M</button><button class="key del" onclick="bs()">⌫ Șterge</button>
        </div>
        <div class="row">
          <button class="key w" onclick="k(' ')">SPAȚIU</button>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="vid">
        <div class="vbar"><span class="vtag">MOMENTE SPECIALE</span><button class="vol" id="volbtn" onclick="toggleSound()">🔇</button></div>
        <video id="v" autoplay loop muted playsinline></video>
        <img id="imgv" alt="">
      </div>
      <div class="map">
        <div class="mtag">SCHIȚĂ SALĂ RESTAURANT</div>
        <img id="mapimg" alt="">
        <div class="nomap" id="nomap">Încarcă schița din Panou Control</div>
      </div>
    </div>
  </div>
</div>
<button class="fs" onclick="fs()">⛶</button>
<div class="admin"><button class="abtn" onclick="openM()">⚙ Panou Control</button></div>
<div id="modal">
  <div class="box">
    <h2 style="color:var(--gold);margin-bottom:12px;">Panou Control</h2>
    <div class="fg"><label>Nume eveniment</label><input id="cfgT" value="BOTEZ MORGAN - 18 OCTOMBRIE"></div>
    <div class="fg">
      <label>Upload Video sau Poză (sau URL opțional)</label>
      <input type="file" id="fileV" accept="video/*,image/*" onchange="upVideo(event)" style="margin-bottom:6px;">
      <input id="cfgV" placeholder="sau URL video/poză">
    </div>
    <div class="fg">
      <label>Upload Schiță sală (sau URL opțional)</label>
      <input type="file" id="fileM" accept="image/*" onchange="upMap(event)" style="margin-bottom:6px;">
      <input id="cfgM" placeholder="sau URL schiță">
    </div>
    <div class="fg"><label>Link QR (opțional – dacă lași gol, folosește linkul de invitat)</label><input id="cfgQ" placeholder="https://..."></div>
    <div class="fg"><label>Listă invitați (Nume | Masa | Zona) — unul pe linie</label><textarea id="cfgL" rows="6">Marioara Marian | Masa 3 | Lângă scenă
Galatanu Marinela | Masa 1 | Intrare
Botorogeanu Marian | Masa 2 | Geam
Marioara Florina | Masa 3 | Lângă scenă</textarea></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button class="abtn" style="background:var(--green);color:#000;" onclick="save()">✔ Salvează</button>
      <button class="abtn" style="background:#c0392b;" onclick="resetEv()">🔄 Reset Eveniment</button>
      <button class="abtn" style="background:#555;" onclick="closeM()">Închide</button>
    </div>
  </div>
</div>
<script>
let G=[], cur=-1, timer=null, media="", mapu="";
const isGuest = new URLSearchParams(location.search).get("view") === "guest";
if(isGuest) document.body.classList.add("guest-mode");
function clean(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ș|ş/gi,"s").replace(/ț|ţ/gi,"t").toUpperCase().trim();}
onload=()=>{document.getElementById("q").oninput=e=>{search(e.target.value);arm();};load();};
function load(){
  const c=localStorage.getItem("k7");
  const st=JSON.parse(localStorage.getItem("k7s")||"{}");
  if(c){const j=JSON.parse(c);
    document.getElementById("title").textContent=j.t;
    document.getElementById("cfgT").value=j.t;
    document.getElementById("cfgV").value=j.v||"";
    document.getElementById("cfgM").value=j.m||"";
    document.getElementById("cfgQ").value=j.q||"";
    document.getElementById("cfgL").value=j.l;
    media=j.v||""; mapu=j.m||"";
    setMedia(media); setMap(mapu); parse(j.l,st); makeQR(j.q);
  }else{parse(document.getElementById("cfgL").value,{}); setMedia(document.getElementById("cfgV").value); makeQR("");}
  stats();
}
function guestUrl(){
  const u = new URL(location.href);
  u.searchParams.set("view","guest");
  return u.toString();
}
function makeQR(custom){
  const c=document.getElementById("qr"); c.innerHTML="";
  const url = custom && custom.trim() ? custom.trim() : guestUrl();
  if(typeof QRCode!=="undefined"){
    new QRCode(c,{text:url,width:90,height:90,colorDark:"#000",colorLight:"#fff"});
    const lbl=document.createElement("div"); lbl.className="qr-label"; lbl.textContent="SCAN"; c.appendChild(lbl);
  }
}
function setMedia(u){
  const v=document.getElementById("v"), i=document.getElementById("imgv");
  if(!u){v.style.display="none";i.style.display="none";return;}
  const isImg = u.startsWith("data:image") || /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(u);
  if(isImg){v.style.display="none";v.pause();i.style.display="block";i.src=u;}
  else{i.style.display="none";v.style.display="block";v.src=u;v.play().catch(()=>{});}
}
function toggleSound(){
  const v=document.getElementById("v"), b=document.getElementById("volbtn");
  if(v.style.display==="none")return;
  v.muted=!v.muted;
  b.textContent=v.muted?"🔇":"🔊";
  b.classList.toggle("on",!v.muted);
}
function setMap(u){
  const i=document.getElementById("mapimg"), n=document.getElementById("nomap");
  if(u){i.src=u;i.style.display="block";n.style.display="none";}else{i.style.display="none";n.style.display="flex";}
}
function upVideo(e){
  const f=e.target.files[0]; if(!f)return;
  if(f.type.startsWith("video")){ media=URL.createObjectURL(f); setMedia(media); }
  else{ const r=new FileReader(); r.onload=ev=>{media=ev.target.result; setMedia(media);}; r.readAsDataURL(f); }
}
function upMap(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=ev=>{mapu=ev.target.result; setMap(mapu);}; r.readAsDataURL(f);
}
function save(){
  const manualV=document.getElementById("cfgV").value.trim();
  const manualM=document.getElementById("cfgM").value.trim();
  if(manualV) media=manualV;
  if(manualM) mapu=manualM;
  const o={t:document.getElementById("cfgT").value,v:media,m:mapu,q:document.getElementById("cfgQ").value.trim(),l:document.getElementById("cfgL").value};
  try{localStorage.setItem("k7",JSON.stringify(o));}catch(e){console.warn("storage",e);}
  document.getElementById("title").textContent=o.t;
  setMedia(media); setMap(mapu); parse(o.l,JSON.parse(localStorage.getItem("k7s")||"{}")); makeQR(o.q);
  closeM(); clearQ();
}
function resetEv(){
  if(!confirm("Resetezi toate check-in-urile? Lista rămâne."))return;
  localStorage.removeItem("k7s");
  G.forEach(g=>g.a=false); stats(); clearQ();
  alert("Resetat. Toți invitații sunt din nou în așteptare.");
}
function parse(t,st){
  G=[]; (t||"").split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return; const p=l.split("|").map(x=>x.trim()); if(p[0])G.push({n:p[0],m:p[1]||"—",z:p[2]||"",a:st[p[0]]===true});});
  stats();
}
function stats(){
  const a=G.filter(g=>g.a).length;
  document.getElementById("arr").textContent="SOSIȚI: "+a;
  document.getElementById("tot").textContent="TOTAL: "+G.length;
}
function k(ch){const i=document.getElementById("q");i.value+=ch;search(i.value);arm();}
function bs(){const i=document.getElementById("q");i.value=i.value.slice(0,-1);search(i.value);arm();}
function clearQ(){
  document.getElementById("q").value=""; cur=-1;
  document.getElementById("rn").textContent="Tastați pe tastatură";
  document.getElementById("rt").textContent="MASA: ---";
  document.getElementById("rz").textContent="";
  document.getElementById("chk").style.display="none";
  document.getElementById("matches").style.display="none";
  document.getElementById("matches").innerHTML="";
}
function search(q){
  const c=clean(q); const box=document.getElementById("matches");
  box.innerHTML=""; box.style.display="none";
  if(!c){clearQ();return;}
  const ms=G.map((g,i)=>({...g,i})).filter(g=>clean(g.n).includes(c));
  if(!ms.length){document.getElementById("rn").textContent="Nu s-a găsit";document.getElementById("rt").textContent="MASA: ---";document.getElementById("chk").style.display="none";return;}
  if(ms.length>1){
    box.style.display="flex";
    ms.forEach(m=>{const d=document.createElement("div");d.className="cube"+(m.i===cur?" on":"");d.textContent=m.n;d.onclick=()=>sel(m.i);box.appendChild(d);});
  }
  sel(ms[0].i);
}
function sel(i){
  cur=i; const g=G[i];
  document.getElementById("rn").textContent=g.n;
  document.getElementById("rt").textContent=g.m;
  document.getElementById("rz").textContent=g.z?"✓ "+g.z:"";
  const b=document.getElementById("chk"); b.style.display="block";
  if(g.a){b.textContent="✓ Deja sosit";b.disabled=true;b.style.background="#555";}
  else{b.textContent="Sosir ✓";b.disabled=false;b.style.background="var(--green)";}
}
function check(){
  if(cur<0)return; G[cur].a=true;
  const m={}; G.forEach(g=>m[g.n]=g.a); localStorage.setItem("k7s",JSON.stringify(m));
  stats(); const b=document.getElementById("chk"); b.textContent="✓ Bine ați venit!"; b.disabled=true;
  setTimeout(clearQ,2500);
}
function arm(){if(timer)clearTimeout(timer);timer=setTimeout(clearQ,15000);}
function openM(){document.getElementById("modal").style.display="flex";}
function closeM(){document.getElementById("modal").style.display="none";}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
function focusSearch(){/* just a visual cue – keyboard is always visible */ }
</script>
</body>
</html>
